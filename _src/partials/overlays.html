  <div class="modal" id="workModal" hidden>

      <div class="modal__thumb" id="mThumb"></div>
      <div class="modal__body">
        <p class="modal__cat" id="mCat"></p>
        <h3 id="mTitle"></h3>
        <p class="modal__lead" id="mLead"></p>

  <!-- ===== CHAT ASSISTANT ===== -->
  <div class="chat" id="chat">
    <button class="chat__launch" id="chatLaunch" aria-label="Open chat assistant">
      <span class="chat__ico">💬</span><span class="chat__hello">Questions? Ask me!</span>
    </button>
    <div class="chat__panel" id="chatPanel" hidden>
      <div class="chat__head">
        <div class="chat__av"><img src="assets/favicon.svg" alt="" /><i></i></div>
        <div><b>Tech Dollez Assistant</b><small>Instant answers · Arjun on WhatsApp</small></div>
        <button class="chat__x" id="chatClose" aria-label="Close chat">✕</button>
      </div>
      <div class="chat__body" id="chatBody" data-lenis-prevent></div>
      <div class="chat__quick" id="chatQuick"></div>
      <form class="chat__form" id="chatForm">
        <input id="chatInput" placeholder="Type your question…" autocomplete="off" />
        <button type="submit" aria-label="Send">➤</button>
      </form>
    </div>
  </div>

  <!-- ===== COMMAND PALETTE ===== -->
  <div class="cmdk" id="cmdk" hidden>
    <div class="cmdk__backdrop" data-close></div>
    <div class="cmdk__panel" role="dialog" aria-modal="true" aria-label="Command menu">
      <div class="cmdk__search"><span>⌕</span><input id="cmdkInput" placeholder="Search sections and actions…" autocomplete="off" /><kbd>Esc</kbd></div>
      <div class="cmdk__list" id="cmdkList" data-lenis-prevent></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ===== BACK TO TOP ===== -->
  <button class="to-top" id="toTop" aria-label="Back to top">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" class="to-top__bg"/><circle cx="24" cy="24" r="21" class="to-top__ring" id="toTopRing"/></svg>

  </button>
